<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fafafb" />
    <script>
      // Set the theme before first paint so there is no flash: saved choice, else light.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0a0d12' : '#fafafb'
      })()
    </script>
    <meta
      name="description"
      content="The behavioral health EHR you can build on. Start from a proven EHR or a blank slate, and build what your program needs with your own AI tools."
    />
    <meta property="og:title" content="BlueStep Behavioral" />
    <meta
      property="og:description"
      content="Behavioral health software from a team that knows how programs run."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>BlueStep Behavioral</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
